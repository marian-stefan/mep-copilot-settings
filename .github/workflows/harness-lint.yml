name: Harness lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node scripts/harness.mjs lint
          node --test hooks/tool-guardian/guard-tool.test.mjs scripts/workflow-contracts.test.mjs
